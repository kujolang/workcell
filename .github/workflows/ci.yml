name: CI

on:
  pull_request:
  push:
    branches:
      - '**'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: workcell-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  macos-offline:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: adapters/official/package-lock.json

      - name: Install official adapter dependencies
        run: npm ci --ignore-scripts --prefix adapters/official

      - name: Install released Kujo runtime
        id: kujo
        uses: kujolang/kujo/.github/actions/setup-kujo@fc53093f35e4236682bbbf5ab1ccc8d2b4df990c
        with:
          version: v1.6.0
      - name: Export runtime
        run: echo "KUJO_BIN=${{ steps.kujo.outputs.kujo-path }}" >> "$GITHUB_ENV"

      - name: Run macOS offline contract suite
        shell: bash
        run: KUJO="$KUJO_BIN" ./tests/run.sh

      - name: Verify experimental Git effect and process participant
        run: bash tests/effect_assurance.sh

      - name: Exercise interpreter compatibility for portable contracts
        shell: bash
        run: |
          "$KUJO_BIN" run --interpreter tests/backend_test.kujo
          "$KUJO_BIN" run --interpreter tests/portable_definition_test.kujo
          "$KUJO_BIN" run --interpreter tests/evidence_recovery_test.kujo

      - name: Run official adapter suite and integrity gate
        shell: bash
        run: |
          npm run integrity:check --prefix adapters/official
          npm test --prefix adapters/official

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: adapters/official/package-lock.json

      - name: Install official adapter dependencies
        run: npm ci --ignore-scripts --prefix adapters/official

      - name: Install released Kujo runtime
        id: kujo
        uses: kujolang/kujo/.github/actions/setup-kujo@fc53093f35e4236682bbbf5ab1ccc8d2b4df990c
        with:
          version: v1.6.0
      - name: Export runtime
        run: echo "KUJO_BIN=${{ steps.kujo.outputs.kujo-path }}" >> "$GITHUB_ENV"

      - name: Verify product and runtime version consistency
        shell: bash
        run: KUJO="$KUJO_BIN" ./tests/version_consistency.sh

      - name: Run offline and CLI contract suite
        shell: bash
        run: KUJO="$KUJO_BIN" ./tests/run.sh

      - name: Verify experimental Git effect and process participant
        run: bash tests/effect_assurance.sh

      - name: Exercise interpreter compatibility for portable contracts
        shell: bash
        run: |
          "$KUJO_BIN" run --interpreter tests/backend_test.kujo
          "$KUJO_BIN" run --interpreter tests/portable_definition_test.kujo
          "$KUJO_BIN" run --interpreter tests/evidence_recovery_test.kujo

      - name: Run formatting and lint gates
        shell: bash
        run: KUJO="$KUJO_BIN" ./tests/quality.sh

      - name: Run official adapter offline suite
        shell: bash
        run: |
          npm run integrity:check --prefix adapters/official
          npm test --prefix adapters/official

      - name: Audit local Markdown links
        shell: bash
        run: ./tests/markdown_links.sh

      - name: Verify release report metadata
        shell: bash
        run: |
          set -euo pipefail
          KUJO="$KUJO_BIN" ./tests/release_report.sh | tee /tmp/workcell-release-report.json
          jq -e --arg version "$(cat VERSION)" '.ok == true and .workcell_version == $version' /tmp/workcell-release-report.json >/dev/null

      - name: Verify Docker BuildKit support
        shell: bash
        run: docker buildx version

      - name: Build Workcell base image
        shell: bash
        run: docker build --tag kujolang/workcell-base:local docker/

      - name: Run Docker doctor
        shell: bash
        run: KUJO="$KUJO_BIN" ./bin/workcell doctor --backend docker --json

      - name: Run Docker integration suite
        shell: bash
        run: REQUIRE_BACKEND=true KUJO="$KUJO_BIN" ./tests/docker_integration.sh docker

      - name: Run Docker concurrent-load evidence
        shell: bash
        run: REQUIRE_BACKEND=true KUJO="$KUJO_BIN" ./tests/load_integration.sh docker

      - name: Run Docker egress enforcement evidence
        shell: bash
        run: REQUIRE_BACKEND=true KUJO="$KUJO_BIN" ./tests/egress_integration.sh docker

      - name: Run Workcell self-proof and verify receipt
        shell: bash
        run: |
          set -euo pipefail
          KUJO="$KUJO_BIN" ./bin/workcell run --file workcell.json --repo . --no-pull --json > /tmp/workcell-self-proof.json
          run_dir="$(dirname "$(jq -r '.receipt_path' /tmp/workcell-self-proof.json)")"
          KUJO="$KUJO_BIN" ./bin/workcell verify --run "$run_dir" --json | jq -e '.ok == true' >/dev/null

      - name: Install Podman for OCI backend evidence
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes podman

      - name: Run Podman doctor
        shell: bash
        run: KUJO="$KUJO_BIN" ./bin/workcell doctor --backend podman --json

      - name: Run Podman OCI smoke
        shell: bash
        run: REQUIRE_BACKEND=true KUJO="$KUJO_BIN" ./tests/oci_smoke.sh podman

      - name: Run Podman integration suite
        shell: bash
        run: REQUIRE_BACKEND=true KUJO="$KUJO_BIN" ./tests/docker_integration.sh podman

      - name: Run Podman concurrent-load evidence
        shell: bash
        run: REQUIRE_BACKEND=true KUJO="$KUJO_BIN" ./tests/load_integration.sh podman

      - name: Run Podman egress enforcement evidence
        shell: bash
        run: REQUIRE_BACKEND=true KUJO="$KUJO_BIN" ./tests/egress_integration.sh podman

      - name: Run ShipCheck release gate
        shell: bash
        env:
          SHIPCHECK_REF: 2768e3040e766b0befd354db4427afc4c7a81899
        run: |
          set -euo pipefail
          git init /tmp/shipcheck
          git -C /tmp/shipcheck remote add origin https://github.com/kujolang/shipcheck.git
          git -C /tmp/shipcheck fetch --depth 1 origin "$SHIPCHECK_REF"
          git -C /tmp/shipcheck checkout --detach "$SHIPCHECK_REF"
          cd /tmp/shipcheck
          "$KUJO_BIN" run shipcheck.kujo gate --dir "$GITHUB_WORKSPACE" --format json | tee /tmp/workcell-shipcheck.json
          jq -e '.summary.gate_passed == 1 and .summary.failed_errors == 0 and .summary.warnings == 0' /tmp/workcell-shipcheck.json >/dev/null

      - name: Check whitespace
        shell: bash
        run: git diff --check
