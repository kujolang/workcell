name: Live provider certification

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Exact provider to certify
        required: true
        type: choice
        options: [e2b, vercel-sandbox, daytona]
      profile_id:
        description: Approved profile ID in the protected profiles secret
        required: true
        type: string
      account_plan:
        description: Exact approved account and plan/tier label
        required: true
        type: string
      region:
        description: Exact provider region
        required: true
        type: string
      image_template:
        description: Immutable image or template identifier
        required: true
        type: string
      spend_ceiling:
        description: Reviewed provider-native spend ceiling reference
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: workcell-live-${{ inputs.provider }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: workcell-live-${{ inputs.provider }}
    env:
      WORKCELL_LIVE_AUTHORIZED: "1"
      WORKCELL_LIVE_PROFILE_ID: ${{ inputs.profile_id }}
      WORKCELL_LIVE_ACCOUNT_PLAN: ${{ inputs.account_plan }}
      WORKCELL_LIVE_REGION: ${{ inputs.region }}
      WORKCELL_LIVE_IMAGE_TEMPLATE: ${{ inputs.image_template }}
      WORKCELL_LIVE_SPEND_CEILING: ${{ inputs.spend_ceiling }}
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
      VERCEL_OIDC_TOKEN: ${{ secrets.VERCEL_OIDC_TOKEN }}
      DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
      WORKCELL_LIVE_PROFILES_JSON: ${{ secrets.WORKCELL_LIVE_PROFILES_JSON }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: adapters/official/package-lock.json
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - name: Build exact Kujo runtime
        shell: bash
        run: |
          set -euo pipefail
          ref="$(cat RUNTIME_VERSION)"
          git init "$RUNNER_TEMP/kujo-runtime"
          git -C "$RUNNER_TEMP/kujo-runtime" remote add origin https://github.com/kujolang/kujo.git
          git -C "$RUNNER_TEMP/kujo-runtime" fetch --depth 1 origin "$ref"
          git -C "$RUNNER_TEMP/kujo-runtime" checkout --detach "$ref"
          cargo build --release --locked --manifest-path "$RUNNER_TEMP/kujo-runtime/Cargo.toml" --bin kujo
          echo "KUJO=$RUNNER_TEMP/kujo-runtime/target/release/kujo" >> "$GITHUB_ENV"
      - name: Install and verify exact adapter tree
        run: |
          npm ci --ignore-scripts --prefix adapters/official
          npm run integrity:check --prefix adapters/official
      - name: Materialize protected host profiles
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WORKCELL_LIVE_PROFILES_JSON"
          umask 077
          printf '%s' "$WORKCELL_LIVE_PROFILES_JSON" > "$RUNNER_TEMP/workcell-live-profiles.json"
          jq -e --arg profile "$WORKCELL_LIVE_PROFILE_ID" '.schema == "workcell-host-profiles/v1alpha1" and (.profiles[$profile] | type == "object")' "$RUNNER_TEMP/workcell-live-profiles.json" >/dev/null
          echo "WORKCELL_LIVE_PROFILES_FILE=$RUNNER_TEMP/workcell-live-profiles.json" >> "$GITHUB_ENV"
          echo "WORKCELL_LIVE_EVIDENCE_DIR=$RUNNER_TEMP/workcell-live-evidence" >> "$GITHUB_ENV"
      - name: Set exact provider gate
        shell: bash
        run: |
          case "${{ inputs.provider }}" in
            e2b) echo "WORKCELL_LIVE_E2B=1" >> "$GITHUB_ENV" ;;
            vercel-sandbox) echo "WORKCELL_LIVE_VERCEL_SANDBOX=1" >> "$GITHUB_ENV" ;;
            daytona) echo "WORKCELL_LIVE_DAYTONA=1" >> "$GITHUB_ENV" ;;
            *) exit 2 ;;
          esac
      - name: Run bounded live certification smoke
        run: ./tests/live_certification.sh "${{ inputs.provider }}"
      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workcell-live-${{ inputs.provider }}-${{ github.run_id }}
          path: ${{ runner.temp }}/workcell-live-evidence
          if-no-files-found: error
          retention-days: 7
