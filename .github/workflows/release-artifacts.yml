name: release-artifacts

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  release-gates:
    uses: ./.github/workflows/ci.yml

  build-source-artifacts:
    needs: release-gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Verify tag and version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Build pinned Kujo runtime
        shell: bash
        run: |
          set -euo pipefail
          KUJO_RUNTIME_REF="$(cat RUNTIME_VERSION)"
          git init /tmp/kujo-runtime
          git -C /tmp/kujo-runtime remote add origin https://github.com/kujolang/kujo.git
          git -C /tmp/kujo-runtime fetch --depth 1 origin "$KUJO_RUNTIME_REF"
          git -C /tmp/kujo-runtime checkout --detach "$KUJO_RUNTIME_REF"
          test "$(git -C /tmp/kujo-runtime rev-parse HEAD)" = "$KUJO_RUNTIME_REF"
          cargo build --release --locked --manifest-path /tmp/kujo-runtime/Cargo.toml --bin kujo
          echo "KUJO_BIN=/tmp/kujo-runtime/target/release/kujo" >> "$GITHUB_ENV"

      - name: Build and verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          KUJO="$KUJO_BIN" ./tests/version_consistency.sh
          KUJO="$KUJO_BIN" ./tests/release_report.sh > "$RUNNER_TEMP/workcell-report.json"
          ./scripts/build_release_artifacts.sh "$RUNNER_TEMP/workcell-release" "$RUNNER_TEMP/workcell-report.json" "$GITHUB_SHA"
          cd "$RUNNER_TEMP/workcell-release"
          shasum -a 256 -c "workcell-$(cat "$GITHUB_WORKSPACE/VERSION")-checksums.txt"

      - name: Upload verified source release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workcell-${{ github.ref_name }}-source-release
          path: ${{ runner.temp }}/workcell-release/
          if-no-files-found: error
          retention-days: 90
