objective: "Build and verify the Kujo-native Workcell Docker-backed local execution MVP from the attached specification."
checklist_file: ""
max_iterations: 8
max_no_progress: 2
max_consecutive_failures: 3

allowed_actions:
  - read_files
  - edit_files
  - run_tests
  - commit_local_changes

blocked_actions:
  - deploy
  - destructive_cleanup
  - production_config_change

eval_gates:
  - id: kujo_checks
    command: "KUJO=../kujo/target/release/kujo ./tests/run.sh --check-only"
    required: true

  - id: kujo_tests
    command: "KUJO=../kujo/target/release/kujo ./tests/run.sh"
    required: true

  - id: cli_smoke
    command: "KUJO=../kujo/target/release/kujo ./bin/workcell help"
    required: true

  - id: diff_check
    command: "git diff --check"
    required: true

  - id: docker_integration
    command: "TMPDIR=/var/folders/... KUJO=../kujo/target/release/kujo ./tests/docker_integration.sh"
    required: true

  - id: doctor
    command: "TMPDIR=/var/folders/... KUJO=../kujo/target/release/kujo ./bin/workcell doctor --json"
    required: true

commit:
  enabled: true
  strategy: small_meaningful
  push: true

memory:
  enabled: true
  provider: strata
  project: "Agent Notes"
  mode: consolidate
  retrieval_tests: true
