# fence.toml - architecture boundary contract
# Generated by `fence init`. Edit to match your project.
# Docs: run `kujo run fence.kujo -- help`.

version = 1
source_roots = ["src"]
default_severity = "error"
fail_on = "error"
unknown_dependency_policy = "warn"

[scan]
include = [
  "src/**/*.ts",
  "src/**/*.tsx",
  "src/**/*.js",
  "src/**/*.jsx",
  "src/**/*.py",
  "src/**/*.rs",
  "src/**/*.php",
  "src/**/*.go",
  "src/**/*.kujo"
]
exclude = [
  "node_modules/**",
  "vendor/**",
  "dist/**",
  "build/**",
  "coverage/**",
  ".git/**",
  "**/*.min.js",
  "**/*.generated.*"
]

[zones.cli]
paths = ["src/cli/**"]
can_depend_on = ["doctor", "domain", "execution", "policy", "runtime", "workspace", "shared"]
cannot_depend_on = []
severity = "error"

[zones.doctor]
paths = ["src/doctor/**"]
can_depend_on = ["runtime", "workspace", "shared"]
cannot_depend_on = []
severity = "error"

[zones.execution]
paths = ["src/execution/**"]
can_depend_on = ["artifacts", "domain", "integrations", "policy", "receipts", "runtime", "verification", "workspace", "shared"]
cannot_depend_on = []
severity = "error"

[zones.integrations]
paths = ["src/integrations/**"]
can_depend_on = ["shared"]
cannot_depend_on = []
severity = "error"

[zones.artifacts]
paths = ["src/artifacts/**"]
can_depend_on = ["shared"]
cannot_depend_on = []
severity = "error"

[zones.receipts]
paths = ["src/receipts/**"]
can_depend_on = ["shared"]
cannot_depend_on = []
severity = "error"

[zones.policy]
paths = ["src/policy/**"]
can_depend_on = ["shared"]
cannot_depend_on = []
severity = "error"

[zones.runtime]
paths = ["src/runtime/**"]
can_depend_on = ["policy", "shared"]
cannot_depend_on = []
severity = "error"

[zones.workspace]
paths = ["src/workspace/**"]
can_depend_on = ["shared"]
cannot_depend_on = []
severity = "error"

[zones.verification]
paths = ["src/verification/**"]
can_depend_on = ["policy", "runtime", "shared"]
cannot_depend_on = []
severity = "error"

[zones.domain]
paths = ["src/domain/**"]
can_depend_on = ["shared"]
cannot_depend_on = []
severity = "error"

[zones.shared]
paths = ["src/util.kujo"]
can_depend_on = []
cannot_depend_on = ["cli", "doctor", "execution", "artifacts", "receipts", "policy", "runtime", "workspace", "domain"]
severity = "error"

[zones.commands]
paths = ["src/commands/**"]
can_depend_on = ["domain", "shared"]
cannot_depend_on = []
severity = "error"
